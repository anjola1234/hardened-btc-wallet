[package]
name = "wallet-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "wallet_core"
path = "src/lib.rs"

[dependencies]
rand = "0.8"
getrandom = "0.2"
zeroize = { version = "1.8", features = ["derive"] }
bip39 = { version = "2.1", features = ["zeroize"] }
argon2 = "0.5"
chacha20poly1305 = "0.10"
bitcoin = "0.32"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ureq (our HTTP client) is deliberately NOT here -- it's native-only and
# won't compile to WASM. Network calls move to the `cli` and `web` crates
# separately: `cli` keeps using ureq, `web` will use the browser's own
# fetch API via wasm-bindgen. `core` stays network-agnostic.