[package]
name = "wallet-web"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

[dependencies]
wallet-core = { path = "../core" }
wasm-bindgen = "0.2"
bip39 = { version = "2.1", features = ["zeroize"] }
bitcoin = "0.32"
serde_json = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }