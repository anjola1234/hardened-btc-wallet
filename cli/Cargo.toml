[package]
name = "hardened-btc-wallet-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "hardened-btc-wallet"
path = "src/main.rs"

[dependencies]
wallet-core = { path = "../core" }
bip39 = { version = "2.1", features = ["zeroize"] }
bitcoin = "0.32"
zeroize = { version = "1.8", features = ["derive"] }
rpassword = "7.3"
ureq = { version = "2.10", features = ["json", "tls"] }
serde_json = "1.0"